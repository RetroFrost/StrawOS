name: Build Frameflow APK

on:
  push:
    branches: [ frameflow-build ]
    paths:
      - 'frameflow/**'
      - '.github/workflows/frameflow-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: frameflow
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Frameflow-debug-apk
          path: frameflow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
